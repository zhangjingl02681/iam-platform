spring:
  application:
    name: iam-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/iam
    username: iam
    password: iam_dev_only
    hikari:
      pool-name: iam-hikari
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

iam:
  security:
    max-failed-attempts: 5
    lock-duration: PT15M
    password-history-size: 5
  oidc:
    issuer: http://localhost:8080
    # Dev default: a generated RSA JWK is written here on first start (gitignored).
    # Production must load signing keys from a vault; do not use this file in prod.
    jwk-location: .data/dev-signing-jwk.json
    access-token-ttl: PT10M
    refresh-token-ttl: PT8H
    authorization-code-ttl: PT5M
    id-token-ttl: PT15M
    session-idle-timeout: PT30M
    session-absolute-timeout: PT8H
  bootstrap:
    admin:
      enabled: false
      username: admin
      password: ""
      display-name: 系统管理员
    clients:
      enabled: false
      web-secret: ""
      api-secret: ""
